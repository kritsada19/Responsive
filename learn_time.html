<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MJU</title>

    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>

<body id="top" class="bg-slate-100 min-h-screen flex flex-col">

    <nav class="flex justify-between items-center bg-gray-500 text-white p-2 px-4 md:px-6 md:py-3 lg:px-10 lg:py-4">
        <div class="flex items-center space-x-3 md:space-x-4 lg:hidden">
            <button class="focus:outline-none" aria-label="Toggle Menu">
                <svg class="w-6 h-6 md:w-7 md:h-7 lg:w-8 lg:h-8" fill="none" stroke="currentColor" stroke-width="2"
                    viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 12h16M4 18h16"></path>
                </svg>
            </button>
        </div>

        <div class="hidden lg:block">
            <ul class="flex space-x-4 md:space-x-6 lg:space-x-8">
                <li><a href="#" class="hover:text-gray-300">เมนูหลัก</a></li>
                <li><a href="#" class="hover:text-gray-300 font-bold">เข้าสู่ระบบ (SSO)</a></li>
                <li><a href="#" class="hover:text-gray-300">วิชาที่เปิดสอน</a></li>
                <li><a href="#" class="hover:text-gray-300 bg-gray-600 p-2 rounded-lg">ตารางเวลา</a></li>
                <li><a href="#" class="hover:text-gray-300">ปฏิทินการศึกษา</a></li>
                <li><a href="#" class="hover:text-gray-300">ตอบคำถาม</a></li>
                <li><a href="#" class="hover:text-gray-300">แนะนำการลงทะเบียน</a></li>
                <li><a href="#" class="hover:text-gray-300">วิธีการพิมพ์ใบเสร็จ</a></li>
                <li><a href="#" class="hover:text-gray-300">เว็ปไซต์สำนักบริหารฯ</a></li>
            </ul>
        </div>

        <div class="flex items-center space-x-2 md:space-x-3 lg:space-x-4">
            <img class="w-8 h-auto md:w-10 lg:w-12"
                src="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAARMAAAC3CAMAAAAGjUrGAAAAFVBMVEX////eEBgAJH3dAADuoqMACXcACHfmFzQuAAABGklEQVR4nO3csRGDQBAEwUPw5B+yXNVPyQajO4KtCWDnYDdPD3ghTUqT0qQ0KU1Kk9KkNClNSpPSpDQpTUqT0qQ0KU1Kk9KkNClNSpPSpDQpTUqT0qTmZDcXuwEAAAAAAAAA+Gfdi1/3mg87TUqT0qQ0KU1Kk9KkNClNSpPSpDQpTUqT0qQ0KU1Kk9KkNClNSpPSpDQpTUqT0qQ0KU1Kk9KkNClNSpPSpDQpTUqT0qQ0KU1Kk9KkNClNSpPSpDQpTUqT0qQ0KU1Kk9KkNClNSpPyV7C719MXEgAAAAAAAADAi13s5mQ3BztNSpPSpDQpTUqT0qQ0KU1Kk9KkNClNSpPSpDQpTUqT0qQ0KU1Kk9KkNClNSpPSpDSpLyoz1t0hk9WgAAAAAElFTkSuQmCC"
                alt="ภาษาไทย">
            <p class="text-xs md:text-sm">
                ภาษาไทย
            </p>
            <p class="text-sm md:text-base">
                &#9660;
            </p>
        </div>
    </nav>

    <main class="flex-1 w-full
                 max-w-xl
                 md:max-w-2xl
                 lg:max-w-4xl
                 xl:max-w-5xl
                 mx-auto
                 px-3
                 sm:px-4
                 md:px-6
                 lg:px-8
                 py-4
                 md:py-6
                 lg:py-8">

        <section>

            <!-- Search Card -->
            <div class="w-full
                        bg-white
                        rounded-xl
                        md:rounded-2xl
                        shadow-md
                        p-4
                        sm:p-5
                        md:p-6
                        lg:p-7
                        space-y-5
                        md:space-y-6">

                <!-- Title -->
                <h2 class="text-lg
                           sm:text-xl
                           md:text-2xl
                           font-bold
                           text-gray-800
                           border-b
                           pb-3
                           md:pb-4">

                    ค้นหาข้อมูลนักศึกษา

                </h2>


                <form class="space-y-4 md:space-y-5">


                    <!-- Student ID -->
                    <div>

                        <label class="block
                                   text-xs
                                   sm:text-sm
                                   md:text-base
                                   font-medium
                                   text-gray-700
                                   mb-1.5">
                            เลขประจำตัวนักศึกษา
                        </label>

                        <input type="text" placeholder="กรอกเลขประจำตัวนักศึกษา" class="w-full
                                   px-3
                                   sm:px-4
                                   py-2
                                   md:py-2.5
                                   text-sm
                                   md:text-base
                                   border
                                   border-gray-300
                                   rounded-lg
                                   focus:ring-2
                                   focus:ring-blue-500
                                   focus:border-blue-500
                                   outline-none
                                   transition">

                    </div>


                    <!-- Name / Lastname -->
                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">

                        <div>

                            <label class="block
                                       text-xs
                                       sm:text-sm
                                       md:text-base
                                       font-medium
                                       text-gray-700
                                       mb-1.5">
                                ชื่อ
                            </label>

                            <input type="text" placeholder="กรอกชื่อ" class="w-full
                                       px-3
                                       sm:px-4
                                       py-2
                                       md:py-2.5
                                       text-sm
                                       md:text-base
                                       border
                                       border-gray-300
                                       rounded-lg
                                       focus:ring-2
                                       focus:ring-blue-500
                                       focus:border-blue-500
                                       outline-none
                                       transition">

                        </div>


                        <div>

                            <label class="block
                                       text-xs
                                       sm:text-sm
                                       md:text-base
                                       font-medium
                                       text-gray-700
                                       mb-1.5">
                                นามสกุล
                            </label>

                            <input type="text" placeholder="กรอกนามสกุล" class="w-full
                                       px-3
                                       sm:px-4
                                       py-2
                                       md:py-2.5
                                       text-sm
                                       md:text-base
                                       border
                                       border-gray-300
                                       rounded-lg
                                       focus:ring-2
                                       focus:ring-blue-500
                                       focus:border-blue-500
                                       outline-none
                                       transition">

                        </div>

                    </div>


                    <!-- Status -->
                    <div>

                        <label class="block
                                   text-xs
                                   sm:text-sm
                                   md:text-base
                                   font-medium
                                   text-gray-700
                                   mb-2">
                            สถานภาพ
                        </label>


                        <div class="flex flex-wrap gap-x-4 gap-y-2">

                            <label class="inline-flex
                                       items-center
                                       space-x-2
                                       cursor-pointer">
                                <input type="checkbox" name="status" value="all" class="w-4 h-4
                                           md:w-5 md:h-5
                                           text-blue-600
                                           rounded
                                           border-gray-300
                                           focus:ring-blue-500">

                                <span class="text-xs sm:text-sm md:text-base text-gray-700">
                                    ทั้งหมด
                                </span>

                            </label>


                            <label class="inline-flex
                                       items-center
                                       space-x-2
                                       cursor-pointer">
                                <input type="checkbox" name="status" value="normal" class="w-4 h-4
                                           md:w-5 md:h-5
                                           text-blue-600
                                           rounded
                                           border-gray-300
                                           focus:ring-blue-500">

                                <span class="text-xs sm:text-sm md:text-base text-gray-700">
                                    ปกติ
                                </span>

                            </label>


                            <label class="inline-flex
                                       items-center
                                       space-x-2
                                       cursor-pointer">
                                <input type="checkbox" name="status" value="graduated" class="w-4 h-4
                                           md:w-5 md:h-5
                                           text-blue-600
                                           rounded
                                           border-gray-300
                                           focus:ring-blue-500">

                                <span class="text-xs sm:text-sm md:text-base text-gray-700">
                                    จบการศึกษา
                                </span>

                            </label>


                            <label class="inline-flex
                                       items-center
                                       space-x-2
                                       cursor-pointer">
                                <input type="checkbox" name="status" value="dismissed" class="w-4 h-4
                                           md:w-5 md:h-5
                                           text-blue-600
                                           rounded
                                           border-gray-300
                                           focus:ring-blue-500">

                                <span class="text-xs sm:text-sm md:text-base text-gray-700">
                                    พ้นสภาพ
                                </span>

                            </label>

                        </div>

                    </div>


                    <!-- Result Limit -->
                    <div>

                        <label class="block
                                   text-xs
                                   sm:text-sm
                                   md:text-base
                                   font-medium
                                   text-gray-700
                                   mb-1.5">
                            จำนวนรายการที่ได้จากการค้นหา
                        </label>

                        <select class="w-full
                                   px-3
                                   sm:px-4
                                   py-2
                                   md:py-2.5
                                   text-sm
                                   md:text-base
                                   border
                                   border-gray-300
                                   rounded-lg
                                   bg-white
                                   focus:ring-2
                                   focus:ring-blue-500
                                   focus:border-blue-500
                                   outline-none
                                   transition">

                            <option value="25">
                                ไม่เกิน 25 รายการ
                            </option>

                            <option value="50">
                                ไม่เกิน 50 รายการ
                            </option>

                            <option value="100">
                                ไม่เกิน 100 รายการ
                            </option>

                        </select>

                    </div>


                    <!-- Search Button -->
                    <div class="pt-1 md:pt-2">

                        <button type="submit" class="w-full
                                   bg-[#0D8230]
                                   hover:bg-green-700
                                   text-white
                                   text-sm
                                   md:text-base
                                   font-medium
                                   py-2.5
                                   md:py-3
                                   px-4
                                   rounded-lg
                                   shadow
                                   transition
                                   duration-200">
                            ค้นหาข้อมูล
                        </button>

                    </div>

                </form>

            </div>

        </section>

    </main>

    <footer class="bg-gray-500
               px-3
               py-2.5
               sm:px-4
               md:px-6
               md:py-3
               lg:px-8
               lg:py-4">

        <div class="w-full
                   max-w-xl
                   md:max-w-2xl
                   lg:max-w-4xl
                   xl:max-w-5xl
                   mx-auto
                   flex
                   items-center">

            <p class="text-xs sm:text-sm md:text-base text-white">
                © MJU
            </p>

        </div>

    </footer>

</body>

</html>
