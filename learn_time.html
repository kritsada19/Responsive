<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MJU</title>

    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>

<body class="bg-slate-100 min-h-screen">

    <nav class="flex justify-between items-center bg-gray-500 text-white p-2 px-4 md:px-6 md:py-3 lg:px-10 lg:py-4">
        <div class="flex items-center space-x-3 md:space-x-4 lg:hidden">
            <button class="focus:outline-none" aria-label="Toggle Menu">
                <svg class="w-6 h-6 md:w-7 md:h-7 lg:w-8 lg:h-8" fill="none" stroke="currentColor" stroke-width="2"
                    viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 12h16M4 18h16"></path>
                </svg>
            </button>
        </div>

        <div class="hidden lg:block">
            <ul class="flex space-x-4 md:space-x-6 lg:space-x-8">
                <li><a href="#" class="hover:text-gray-300 bg-gray-600 p-2">เมนูหลัก</a></li>
                <li><a href="#" class="hover:text-gray-300 font-bold">เข้าสู่ระบบ (SSO)</a></li>
                <li><a href="#" class="hover:text-gray-300">วิชาที่เปิดสอน</a></li>
                <li><a href="#" class="hover:text-gray-300">ตารางเวลา</a></li>
                <li><a href="#" class="hover:text-gray-300">ปฏิทินการศึกษา</a></li>
                <li><a href="#" class="hover:text-gray-300">ตอบคำถาม</a></li>
                <li><a href="#" class="hover:text-gray-300">แนะนำการลงทะเบียน</a></li>
                <li><a href="#" class="hover:text-gray-300">วิธีการพิมพ์ใบเสร็จ</a></li>
                <li><a href="#" class="hover:text-gray-300">เว็ปไซต์สำนักบริหารฯ</a></li>
            </ul>
        </div>

        <div class="flex items-center space-x-2 md:space-x-3 lg:space-x-4">
            <img class="w-8 h-auto md:w-10 lg:w-12"
                src="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAARMAAAC3CAMAAAAGjUrGAAAAFVBMVEX////eEBgAJH3dAADuoqMACXcACHfmFzQuAAABGklEQVR4nO3csRGDQBAEwUPw5B+yXNVPyQajO4KtCWDnYDdPD3ghTUqT0qQ0KU1Kk9KkNClNSpPSpDQpTUqT0qQ0KU1Kk9KkNClNSpPSpDQpTUqT0qTmZDcXuwEAAAAAAAAA+Gfdi1/3mg87TUqT0qQ0KU1Kk9KkNClNSpPSpDQpTUqT0qQ0KU1Kk9KkNClNSpPSpDQpTUqT0qQ0KU1Kk9KkNClNSpPSpDQpTUqT0qQ0KU1Kk9KkNClNSpPSpDQpTUqT0qQ0KU1Kk9KkNClNSpPyV7C719MXEgAAAAAAAADAi13s5mQ3BztNSpPSpDQpTUqT0qQ0KU1Kk9KkNClNSpPSpDQpTUqT0qQ0KU1Kk9KkNClNSpPSpDSpLyoz1t0hk9WgAAAAAElFTkSuQmCC"
                alt="ภาษาไทย">
            <p class="text-xs md:text-sm">
                ภาษาไทย
            </p>
            <p class="text-sm md:text-base">
                &#9660;
            </p>
        </div>
    </nav>

    <main class="max-w-5xl mx-auto px-4 py-4 md:px-6 md:py-6 lg:max-w-6xl lg:px-8 lg:py-8 lg:space-y-6">
        <section>
            <div>
                <div class="max-w-xl mx-auto p-6 bg-white rounded-xl shadow-md space-y-6">
                    <h2 class="text-xl font-bold text-gray-800 border-b pb-3">ค้นหาข้อมูลนักศึกษา</h2>

                    <form class="space-y-4">
                        <!-- ช่องกรอกเลขประจำตัวนักศึกษา -->
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">เลขประจำตัวนักศึกษา</label>
                            <input type="text" placeholder="กรอกเลขประจำตัวนักศึกษา"
                                class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition">
                        </div>

                        <!-- ช่องกรอกชื่อ และ นามสกุล -->
                        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                            <div>
                                <label class="block text-sm font-medium text-gray-700 mb-1">ชื่อ</label>
                                <input type="text" placeholder="กรอกชื่อ"
                                    class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition">
                            </div>
                            <div>
                                <label class="block text-sm font-medium text-gray-700 mb-1">นามสกุล</label>
                                <input type="text" placeholder="กรอกนามสกุล"
                                    class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition">
                            </div>
                        </div>

                        <!-- ตัวเลือกสถานภาพ -->
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-2">สถานภาพ</label>
                            <div class="flex flex-wrap gap-4">
                                <label class="inline-flex items-center space-x-2 cursor-pointer">
                                    <input type="checkbox" name="status" value="all"
                                        class="w-4 h-4 text-blue-600 rounded border-gray-300 focus:ring-blue-500">
                                    <span class="text-sm text-gray-700">ทั้งหมด</span>
                                </label>
                                <label class="inline-flex items-center space-x-2 cursor-pointer">
                                    <input type="checkbox" name="status" value="normal"
                                        class="w-4 h-4 text-blue-600 rounded border-gray-300 focus:ring-blue-500">
                                    <span class="text-sm text-gray-700">ปกติ</span>
                                </label>
                                <label class="inline-flex items-center space-x-2 cursor-pointer">
                                    <input type="checkbox" name="status" value="graduated"
                                        class="w-4 h-4 text-blue-600 rounded border-gray-300 focus:ring-blue-500">
                                    <span class="text-sm text-gray-700">จบการศึกษา</span>
                                </label>
                                <label class="inline-flex items-center space-x-2 cursor-pointer">
                                    <input type="checkbox" name="status" value="dismissed"
                                        class="w-4 h-4 text-blue-600 rounded border-gray-300 focus:ring-blue-500">
                                    <span class="text-sm text-gray-700">พ้นสภาพ</span>
                                </label>
                            </div>
                        </div>

                        <!-- จำนวนรายการที่ได้จากการค้นหา -->
                        <div>
                            <label
                                class="block text-sm font-medium text-gray-700 mb-1">จำนวนรายการที่ได้จากการค้นหา</label>
                            <select
                                class="w-full px-4 py-2 border border-gray-300 rounded-lg bg-white focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition">
                                <option value="25">ไม่เกิน 25 รายการ</option>
                                <option value="50">ไม่เกิน 50 รายการ</option>
                                <option value="100">ไม่เกิน 100 รายการ</option>
                            </select>
                        </div>

                        <!-- ปุ่มค้นหา -->
                        <div class="pt-2">
                            <button type="submit" class="w-full bg-[#0D8230] hover:bg-blue-700 text-white font-medium py-2.5 px-4 rounded-lg shadow transition duration-200">
                                ค้นหาข้อมูล
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </section>
    </main>

    <footer class="text-white p-2 px-4 md:px-6 md:p-3 lg:px-8 lg:py-4">
        <img class="mx-auto h-10 md:h-12 lg:h-14"
            src="https://reg.mju.ac.th/registrar/images/common/button/go_top_1.gif" alt="">
    </footer>

</body>

</html>
